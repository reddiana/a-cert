spring:
  application:
    name: batch-clustering-engine-test
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

batch:
  cluster:
    node-id: test-node-1
    port: 0
    allow-single-node: true
    wal-dir: ${java.io.tmpdir}/batch-cluster-test-wal/${random.uuid}

logging:
  level:
    com.batchservice.cluster: INFO
