plugins {
    id 'java-library'
}

group = 'com.sds.batchservice'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot BOM platform
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.2.4')
    compileOnly platform('org.springframework.boot:spring-boot-dependencies:3.2.4')
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.2.4')

    // Embedded library (DD-06): BatchService에 최소 의존성만 전이
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.slf4j:slf4j-api'

    // 선택 의존성: 탑재 애플리케이션에 존재할 때만 활성화 (4.2.1 JDBC/HikariCP, 5.4 Actuator Probe)
    compileOnly 'org.springframework:spring-jdbc'
    compileOnly 'org.springframework.boot:spring-boot-actuator'

    // Test Framework
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-actuator'
    testImplementation 'org.awaitility:awaitility:4.2.1'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    defaultCharacterEncoding = 'UTF-8'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'sun.stdout.encoding', 'UTF-8'
    systemProperty 'sun.stderr.encoding', 'UTF-8'
}

test {
    useJUnitPlatform()
    jvmArgs "-Dfile.encoding=UTF-8", "-Dsun.stdout.encoding=UTF-8", "-Dsun.stderr.encoding=UTF-8"
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = 'full'
    }
}
